<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cronache di Luce e Brace</title>
    <style>
      html, body { margin: 0; background: #000; color: #aaa; }
      body { min-height: 100vh; font-family: "Cascadia Mono", Consolas, "Courier New", monospace; font-size: 18px; line-height: 1.3; }
      #schermo { max-width: 80ch; margin: 0 auto; padding: 1rem; }
      .riga { white-space: pre-wrap; min-height: 1.3em; }
      .campo { margin-top: 0.8em; width: 100%; box-sizing: border-box; background: #000; color: #fff; border: 1px solid #555; padding: 0.3em 0.5em; font: inherit; outline: none; caret-color: #ff5; }
      .campo:focus { border-color: #ff5; }
      /* Palette ANSI a 16 colori (CGA) */
      .c0 { color: #000 } .c1 { color: #00a } .c2 { color: #0a0 } .c3 { color: #0aa }
      .c4 { color: #a00 } .c5 { color: #a0a } .c6 { color: #a50 } .c7 { color: #aaa }
      .c8 { color: #555 } .c9 { color: #55f } .c10 { color: #5f5 } .c11 { color: #5ff }
      .c12 { color: #f55 } .c13 { color: #f5f } .c14 { color: #ff5 } .c15 { color: #fff }
    </style>
  </head>
  <body>
    <div id="schermo"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
